# Base conda environment for expdb_batch
# Contains common dependencies needed for app functionality
# Does NOT include caiman or suite2p - those are in specialized environments
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.26.*
  - pandas>=1.5.0
  - scipy=1.10
  - opencv=4.7.0
  - pynwb<3
  - scikit-image>=0.19.0
  - matplotlib==3.7.*
  - tifffile==2022.3.*
  - hdmf==3.*
