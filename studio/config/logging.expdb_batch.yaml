version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s: %(funcName)s():%(lineno)d - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
  rotating_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: default
    filename: logs/expdb/batch.log
    when: midnight
    interval: 1
    backupCount: 365
  rotating_file_concurrency:
    class: concurrent_log_handler.ConcurrentTimedRotatingFileHandler
    level: DEBUG
    formatter: default
    filename: logs/expdb/batch.log
    encoding: utf-8
    maxBytes: 5242880
    # when: midnight # It seems that concurrent-log-handler=0.9.25 does not work. Verification is required.
    # backupCount ... Number of backups on the same date
    backupCount: 1000
loggers:
  sqlalchemy.engine:
    level: WARNING
root:
  level: INFO
  handlers: [console, rotating_file]
